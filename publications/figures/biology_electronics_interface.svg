<style>
  text { font-family: sans-serif, Arial, Helvetica; fill: #222222; }
  .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
  .subtitle { font-size: 14px; fill: #555555; }
  .label { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
  .small { font-size: 11px; fill: #555555; }
  .tiny { font-size: 9px; fill: #555555; }
  .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; }
  .accent-box { fill: #d0dde8; stroke: #3a6b8c; stroke-width: 1.5; rx: 6; }
  .arrow { stroke: #3a6b8c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .arrow-loop { stroke: #3a6b8c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 8,4; }
  .connector { stroke: #555555; stroke-width: 1.5; fill: none; }
  .phase-box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; }
  .phase-accent { fill: #d0dde8; stroke: #3a6b8c; stroke-width: 2; rx: 6; }
  .go { fill: #2d6a2d; font-weight: bold; }
  .nogo { fill: #8b2020; font-weight: bold; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#3a6b8c"/>
