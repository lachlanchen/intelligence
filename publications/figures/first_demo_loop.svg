<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>
  text { font-family: sans-serif, Arial, Helvetica; fill: #222222; }
  .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
  .subtitle { font-size: 14px; fill: #555555; }
  .label { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
  .small { font-size: 11px; fill: #555555; }
  .tiny { font-size: 9px; fill: #555555; }
  .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; }
  .accent-box { fill: #d0dde8; stroke: #3a6b8c; stroke-width: 1.5; rx: 6; }
  .arrow { stroke: #3a6b8c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .arrow-loop { stroke: #3a6b8c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 8,4; }
  .connector { stroke: #555555; stroke-width: 1.5; fill: none; }
  .phase-box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; }
  .phase-accent { fill: #d0dde8; stroke: #3a6b8c; stroke-width: 2; rx: 6; }
  .go { fill: #2d6a2d; font-weight: bold; }
  .nogo { fill: #8b2020; font-weight: bold; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#3a6b8c"/>
  </marker>
  <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
  </marker>
</defs>

<text x="800" y="40" text-anchor="middle" class="title">Feasible First Demonstration: Software-Only Closed Loop</text>
<text x="800" y="62" text-anchor="middle" class="subtitle">End-to-end pipeline using simulated or public MEA data before wet-lab engagement</text>
<rect x="60" y="110" width="175" height="70" class="accent-box"/>
<text x="147" y="138" text-anchor="middle" class="label">Simulated / Public</text>
<text x="147" y="158" text-anchor="middle" class="small">MEA Spike Data</text>
<rect x="280" y="110" width="175" height="70" class="box"/>
<text x="367" y="138" text-anchor="middle" class="label">Preprocessing</text>
<text x="367" y="158" text-anchor="middle" class="small">Artifact Rejection</text>
<rect x="500" y="110" width="175" height="70" class="box"/>
<text x="587" y="138" text-anchor="middle" class="label">Burst &amp;</text>
<text x="587" y="158" text-anchor="middle" class="small">Synchrony Features</text>
<rect x="720" y="110" width="175" height="70" class="accent-box"/>
<text x="807" y="138" text-anchor="middle" class="label">Reservoir /</text>
<text x="807" y="158" text-anchor="middle" class="small">Readout Model</text>
<rect x="940" y="110" width="175" height="70" class="box"/>
<text x="1027" y="138" text-anchor="middle" class="label">Stimulation</text>
<text x="1027" y="158" text-anchor="middle" class="small">Policy</text>
<rect x="1160" y="110" width="175" height="70" class="box"/>
<text x="1247" y="138" text-anchor="middle" class="label">Safety</text>
<text x="1247" y="158" text-anchor="middle" class="small">Limits</text>
<line x1="235" y1="145" x2="270" y2="145" class="arrow"/>
<line x1="455" y1="145" x2="490" y2="145" class="arrow"/>
<line x1="675" y1="145" x2="710" y2="145" class="arrow"/>
<line x1="895" y1="145" x2="930" y2="145" class="arrow"/>
<line x1="1115" y1="145" x2="1150" y2="145" class="arrow"/>
<line x1="1247" y1="145" x2="1247" y2="230" class="arrow"/>
<rect x="940" y="240" width="340" height="55" class="accent-box"/>
<text x="1110" y="260" text-anchor="middle" class="label">Virtual Stimulation Event</text>
<text x="1110" y="282" text-anchor="middle" class="tiny">(logged pattern replay / in-silico activation)</text>
<line x1="1110" y1="295" x2="1110" y2="340" class="arrow"/>
<rect x="940" y="345" width="340" height="55" class="box"/>
<text x="1110" y="365" text-anchor="middle" class="label">Dashboard &amp; Report</text>
<text x="1110" y="387" text-anchor="middle" class="tiny">(metrics: firing rate, burst rate, synchrony, policy efficacy)</text>
<path d="M 940 400 L 60 400 L 60 145 L 60 145" class="arrow-loop" marker-end="url(#arrowhead)"/>
<text x="500" y="418" text-anchor="middle" class="small">Feedback: update simulation parameters / replay policy</text>
<rect x="60" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="170" y="465" text-anchor="middle" class="label">Data Sources</text>
<text x="70" y="490" text-anchor="start" class="tiny">SpikeInterface / MEA-NAP</text>
<text x="70" y="508" text-anchor="start" class="tiny">Neuropixels / public datasets</text>
<text x="70" y="526" text-anchor="start" class="tiny">Synthetic spike generators</text>
<rect x="310" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="420" y="465" text-anchor="middle" class="label">Preprocessing</text>
<text x="320" y="490" text-anchor="start" class="tiny">Common-average reference</text>
<text x="320" y="508" text-anchor="start" class="tiny">Bandpass filter 300–3000 Hz</text>
<text x="320" y="526" text-anchor="start" class="tiny">Artifact template subtraction</text>
<rect x="560" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="670" y="465" text-anchor="middle" class="label">Feature Extraction</text>
<text x="570" y="490" text-anchor="start" class="tiny">Burst detection (ISI threshold)</text>
<text x="570" y="508" text-anchor="start" class="tiny">Synchrony (STTC, SPIKE-distance)</text>
<text x="570" y="526" text-anchor="start" class="tiny">Firing rate, CV, Fano factor</text>
<rect x="810" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="920" y="465" text-anchor="middle" class="label">Model</text>
<text x="820" y="490" text-anchor="start" class="tiny">Echo State Network / LSM</text>
<text x="820" y="508" text-anchor="start" class="tiny">Ridge regression readout</text>
<text x="820" y="526" text-anchor="start" class="tiny">Cross-validated performance</text>
<rect x="1060" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="1170" y="465" text-anchor="middle" class="label">Stimulation Policy</text>
<text x="1070" y="490" text-anchor="start" class="tiny">Threshold / PID / RL policy</text>
<text x="1070" y="508" text-anchor="start" class="tiny">Charge-balanced biphasic</text>
<text x="1070" y="526" text-anchor="start" class="tiny">Channel selection logic</text>
<rect x="1310" y="470" width="220" height="80" class="box" fill="#f7f9fb"/>
<text x="1420" y="465" text-anchor="middle" class="label">Safety</text>
<text x="1320" y="490" text-anchor="start" class="tiny">Max charge per phase: 4 nC</text>
<text x="1320" y="508" text-anchor="start" class="tiny">Max frequency: 200 Hz</text>
<text x="1320" y="526" text-anchor="start" class="tiny">Thermal / DC offset monitor</text>
<rect x="60" y="580" width="1480" height="100" class="box" fill="#f4f6f8"/>
<text x="800" y="600" text-anchor="middle" class="label">Example Run Log &amp; Exit Criteria</text>
<text x="800" y="622" text-anchor="middle" class="tiny">Mean firing rate: 2.4 ± 0.8 Hz  |  Burst rate: 0.8 ± 0.3 bursts/min  |  STTC synchrony: 0.32 ± 0.06  |  Readout R²: 0.71  |  Policy hit rate: 78%</text>
<text x="800" y="646" text-anchor="middle" class="tiny">Exit: R² ≥ 0.7 AND policy hit rate ≥ 75% over 100 trials → ready for Phase 3 (commercial MEA adapter)</text>
<text x="800" y="670" text-anchor="middle" class="tiny">Otherwise: tune model hyperparameters (spectral radius, leaking rate) or increase simulation epochs → re-run</text>
</svg>
